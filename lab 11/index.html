<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Створення постів</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      max-width: 700px;
      margin: auto;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 25px;
    }

    #postForm {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f8f8f8;
    }

    #postForm label {
      font-weight: bold;
    }

    #postForm input,
    #postForm textarea {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      padding: 8px 15px;
      font-size: 15px;
      cursor: pointer;
      border: 1px solid #444;
      border-radius: 4px;
      background: #eaeaea;
    }

    #counter {
      margin: 20px 0;
      font-size: 18px;
      font-weight: bold;
    }

    .post {
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
    }

    .post h3 {
      margin-top: 0;
    }

    .post small {
      color: #666;
      font-size: 13px;
    }
  </style>

</head>
<body>
  <h1>Створення постів</h1>

  <form id="postForm">
    <div>
      <label for="title">Заголовок</label>
      <input id="title" type="text" required />
    </div>

    <div>
      <label for="body">Текст поста</label>
      <textarea id="body" rows="4" required></textarea>
    </div>

    <div class="buttons">
      <button id="addPost" type="submit">Додати пост</button>
      <button id="clearPosts" type="button">Очистити пости</button>
    </div>
  </form>

  <p id="counter">Усього постів: 0</p>

  <div id="posts"></div>

  <script src="src/main.js" type="module"></script>
</body>
</html>
