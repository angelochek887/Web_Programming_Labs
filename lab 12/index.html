<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript Async Lab</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        article { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        button { padding: 10px 15px; cursor: pointer; }
        input { padding: 8px; margin-right: 10px; width: 250px; }
        #status { font-weight: bold; margin: 15px 0; }
        .controls { margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <main>
        <section>
            <h2>Останні пости</h2>

            <div class="controls">
                <div>
                    <label for="posts-filter">Фільтр за назвою: </label>
                    <input id="posts-filter" type="text" placeholder="Введіть назву...">
                </div>
                <br>
                <button id="reload-posts">Оновити пости</button>
            </div>

            <p id="status"></p>
            
            <p>
                Кількість відображених: <span id="posts-count">0</span>
            </p>

            <div id="posts"></div>
        </section>
    </main>

    <script type="module" src="./dist/index.js"></script>
</body>
</html>
