<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №8</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <form id="registrationForm">
            <h2>Реєстрація</h2>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" aria-describedby="emailError">
                <div id="emailError" class="error-message" role="alert"></div>
            </div>

            <div class="form-group">
                <label for="name">Ім'я:</label>
                <input type="text" id="name" name="name" aria-describedby="nameError">
                <div id="nameError" class="error-message" role="alert"></div>
            </div>

            <button type="submit" class="btn">Зареєструватися</button>
        </form>

        <div id="welcomeScreen" class="hidden">
            <h2>Вітаємо!</h2>
            <p id="welcomeMessage"></p>
            <button id="logoutButton" class="btn">Вийти</button>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
